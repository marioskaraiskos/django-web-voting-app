<form method="post">
    {% csrf_token %}

    <h3>Question</h3>
    {{ form.as_p }}

    <h3>Choices</h3>
    {{ formset.management_form }}
    {% for choice_form in formset %}
        {{ choice_form.as_p }}
    {% endfor %}

    <button type="submit" style="
        background-color: #4CAF50; 
        color: white; 
        border: none; 
        padding: 10px 20px; 
        cursor: pointer;
        font-size: 16px;
        border-radius: 5px;
    ">
        Create Question
    </button>
</form>
